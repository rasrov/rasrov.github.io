name: Optimize images on demand
on:
  workflow_dispatch:
    inputs:
      source:
        description: 'Optional original path, e.g. img/calendar/arnold-uk.png'
        required: false
        default: ''
        type: string
      force:
        description: 'Regenerate existing variants (normally unnecessary)'
        required: false
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: optimize-images
  cancel-in-progress: false
jobs:
  optimize:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install format checker
        run: python -m pip install -r requirements-dev.txt
      - name: Install image dependencies
        run: python -m pip install -r requirements-images.txt
      - name: Prepare optimized images
        env:
          IMAGE_SOURCE: ${{ inputs.source }}
          FORCE: ${{ inputs.force }}
        shell: bash
        run: |
          args=()
          if [[ -n "$IMAGE_SOURCE" ]]; then args+=(--source "$IMAGE_SOURCE"); fi
          if [[ "$FORCE" == "true" ]]; then args+=(--force); fi
          python scripts/optimize_images.py "${args[@]}" | tee "$RUNNER_TEMP/image-report.json"
      - name: Validate changes and build preview
        run: |
          python scripts/validate.py --browser
          python scripts/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: optimized-website-preview
          path: _site
      - name: Open review pull request
        shell: bash
        run: |
          git add -- img/ index.html data/competition-logos.json
          if git diff --cached --quiet; then
            echo 'No image changes required.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          branch="automation/optimize-images-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git switch -c "$branch"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Optimize local images and update references'
          git push origin "$branch"
          body="$RUNNER_TEMP/image-pr.md"
          cat > "$body" <<'BODY'
          Generates local WebP variants and updates the image inventory, HTML references and competition logos. Original images are preserved.

          Validation: full offline validation including browser regressions, followed by a site build. A preview artifact is available in the workflow run.

          Optimization report:
          BODY
          printf '\n```json\n' >> "$body"
          cat "$RUNNER_TEMP/image-report.json" >> "$body"
          printf '\n```\n' >> "$body"
          gh pr create --base "$DEFAULT_BRANCH" --head "$branch" --title 'Optimize local images' --body-file "$body" | tee -a "$GITHUB_STEP_SUMMARY"
